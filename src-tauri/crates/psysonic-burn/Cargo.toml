[package]
name = "psysonic-burn"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[dependencies]
psysonic-core = { path = "../psysonic-core" }
psysonic-syncfs = { path = "../psysonic-syncfs" }

tauri = { version = "2" }
specta = { version = "=2.0.0-rc.25", features = ["derive", "function"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
symphonia = { version = "0.6", default-features = false, features = ["flac", "mp3", "pcm", "aac", "alac", "isomp4", "vorbis", "ogg", "wav", "aiff", "adpcm"] }
rubato = "0.16"
ebur128 = "0.1"
reqwest = { version = "0.13", default-features = false, features = ["stream", "json", "rustls", "gzip", "brotli"] }
tokio = { version = "1", features = ["rt", "time", "sync", "fs"] }
fs4 = "1"

[target.'cfg(target_os = "linux")'.dependencies]
# Only for `open`/`ioctl`/`close`. The SG_IO path is a handful of raw syscalls,
# and libc is the smallest honest way to reach them.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62", features = [
    "Win32_Foundation",
    "Win32_Storage_Imapi",
    "Win32_System_Com",
    "Win32_System_Ole",
    "Win32_System_Variant",
    "Win32_UI_Shell",
] }
windows-core = "0.62"

[dev-dependencies]
tempfile = { workspace = true }
