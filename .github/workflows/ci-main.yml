name: ci-main

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  checks: read
  pull-requests: read

jobs:
  ci-ok:
    runs-on: ubuntu-latest
    steps:
      # Load only the trusted gate implementation. The PR head is inspected via
      # read-only API calls below and must never execute in this job.
      - name: checkout trusted gate code
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha || github.sha }}
          persist-credentials: false
          sparse-checkout: .github/scripts
      - name: aggregate required checks
        uses: actions/github-script@v9
        with:
          script: |
            const { runCiOkAggregate } = await import('${{ github.workspace }}/.github/scripts/ci-ok-aggregate.mjs');
            await runCiOkAggregate(github, context, core);
