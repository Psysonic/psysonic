name: Windows Playlist Scope Test (issue 1664)

# Temporary branch-only installer for human validation. No release or updater publish.
on:
  push:
    branches:
      - fix/playlist-library-legacy-scope

permissions:
  contents: read

jobs:
  bundle:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: lts/*
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - name: Install dependencies
        run: npm ci
      - name: Record source revision
        run: git rev-parse HEAD
      - name: Build unsigned NSIS installer with playlist scope fix
        env:
          VITE_LASTFM_API_KEY: ${{ secrets.VITE_LASTFM_API_KEY }}
          VITE_LASTFM_API_SECRET: ${{ secrets.VITE_LASTFM_API_SECRET }}
        run: npm run tauri:build -- --bundles nsis --verbose
      - name: Verify installer
        shell: pwsh
        run: |
          $installers = @(Get-ChildItem src-tauri/target/release/bundle/nsis -Filter '*-setup.exe' -File)
          if ($installers.Count -ne 1) { throw "Expected one NSIS installer, found $($installers.Count)" }
          Get-FileHash $installers[0].FullName -Algorithm SHA256
      - uses: actions/upload-artifact@v7
        with:
          name: psysonic-issue-1664-windows-scope-fix
          path: src-tauri/target/release/bundle/nsis/*-setup.exe
          if-no-files-found: error
          retention-days: 7
